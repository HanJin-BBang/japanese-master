<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><title>일본어 회화 과정</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172554;font-family:system-ui,sans-serif}header{background:#172554;color:white;padding:18px 16px}header>div,main{max-width:950px;margin:auto}a{color:inherit}header a{color:#bfdbfe}h1{font-size:24px;margin:8px 0}main{padding:12px}button{border:0;border-radius:12px;padding:12px;background:#e2e8f0;color:#172554;font-weight:700;min-height:44px;cursor:pointer}.selected,.primary{background:#2563eb;color:white}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:0;background:#f3f6fb;padding:8px 0;z-index:2}.levels button{font-size:13px;padding:8px 2px}.card{background:white;padding:18px;border-radius:17px;margin:10px 0;box-shadow:0 2px 15px #17255410}.small{font-size:13px;color:#64748b}.line{font-size:clamp(22px,5vw,32px);line-height:1.5;overflow-wrap:anywhere;margin:12px 0}.translation{font-size:16px;color:#475569;line-height:1.5}.prompt{background:#eff6ff;padding:13px;border-radius:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}input{width:100%;font-size:16px;border:1px solid #cbd5e1;padding:13px;border-radius:12px;margin:10px 0}.answer{display:none;border-top:1px solid #e2e8f0;margin-top:16px;padding-top:12px}.answer.open{display:block}.status{font-weight:700;color:#2563eb}.bar{height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden}.fill{height:100%;background:#2563eb;width:0}@media(max-width:600px){header h1{font-size:21px}.card{padding:15px}.levels button{font-size:12px}.row button{font-size:13px;padding:10px 6px}}</style></head><body><header><div><a href="./">← 일본어 마스터 돌아가기</a><h1>🗣️ 일본어 회화 과정</h1><p>짧은 응답 → 생활 회화 → 여행 → 자유 대화 기초</p></div></header><main><nav class="levels" id="levels"></nav><section class="card"><div class="row" style="justify-content:space-between"><b id="lesson"></b><span id="count" class="small"></span></div><div class="bar" style="margin-top:12px"><div class="fill" id="fill"></div></div><p class="small">상대방이 먼저 말합니다. 듣고, 뜻을 확인하고, 직접 답해 보세요.</p><h2 class="line" id="question"></h2><p class="translation" id="questionKo"></p><div class="row"><button id="listen">🔊 질문 듣기</button><button id="listenSlow">🐢 느리게 듣기</button></div></section><section class="card"><b>✍️ 내 차례: 이렇게 답해 보세요</b><div class="prompt"><p class="small">아래 한국어 답변을 보고 직접 말하거나 입력해 보세요.</p><strong id="answerKo"></strong></div><input id="typed" autocomplete="off" placeholder="여기에 외국어 답변을 입력하세요"><div class="row"><button id="check" class="primary">입력 확인</button><button id="show">모범 답변 보기</button></div><p class="status" id="status" aria-live="polite"></p><div class="answer" id="answer"><h2 class="line" id="answerText"></h2><p class="translation" id="answerMeaning"></p><div class="row"><button id="answerAudio">🔊 답변 듣기</button><button id="done" class="primary">✓ 연습 완료</button></div></div></section><div class="row"><button id="prev">← 이전</button><button id="next" class="primary">다음 →</button></div><section class="card"><h3>상황별 회화 목록</h3><div class="items" id="items"></div></section><p class="small">이 과정은 모범 답변을 따라 하는 기초 회화 연습입니다. 자유로운 음성 대화 및 자동 발음 평가는 아직 제공하지 않습니다.</p></main><script src="./conversation.js"></script></body></html>
