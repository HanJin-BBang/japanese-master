<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>일본어 마스터</title>
<style>
:root{--navy:#172554;--blue:#2563eb;--bg:#f3f6fb;--card:#fff;--ink:#1b2d47;--muted:#64748b;--line:#e2e8f0;--good:#15803d;--warn:#b45309;--me:#dbeafe;--you:#f1f5f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
header .in{max-width:640px;margin:auto;display:flex;align-items:center;gap:12px}
header img{width:36px;height:36px;border-radius:9px}
header h1{margin:0;font-size:20px}
main{max-width:640px;margin:auto;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px))}
button{font:inherit;border:0;border-radius:14px;background:#e1e9f3;color:var(--navy);font-weight:700;padding:12px 14px;cursor:pointer}
button:disabled{opacity:.5}
.big{display:block;width:100%;padding:16px;font-size:18px;border-radius:16px}
.primary{background:var(--blue);color:#fff}
.ghost{background:#fff;box-shadow:inset 0 0 0 2px #cbd5e1}
.warn{background:#fff7ed;color:var(--warn);box-shadow:inset 0 0 0 2px #fed7aa}
.mic-btn{background:#fee2e2;color:#b91c1c}
.muted{color:var(--muted);font-weight:400}.small{font-size:13px;line-height:1.6}
section{background:var(--card);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #102f540d}
.hero{position:relative}
.hero h2{margin:0 0 10px;font-size:22px}
.streak{position:absolute;right:16px;top:14px;text-align:center;line-height:1.1}
.streak b{display:block;font-size:28px;color:var(--blue)}.streak span{font-size:12px;color:var(--muted)}
.plan{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.plan li{display:flex;align-items:center;gap:10px;font-size:17px}
.plan i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.hero .big+.big{margin-top:10px}
.chead{display:flex;justify-content:space-between;align-items:baseline}.chead h3{margin:0;font-size:19px}
.course p{margin:4px 0 10px}
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dl{display:flex;align-items:center;gap:8px;text-align:left;background:var(--you);font-weight:600;padding:12px}
.dl .num{width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.dl.ok{background:#dcfce7}.dl.ok .num{background:var(--good);color:#fff}
.tools .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.tools .row>button{flex:1}
.seg{display:flex;gap:6px;flex:1}.seg button{flex:1;padding:10px 6px;font-size:14px}.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.ses{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 4px 18px #102f540d;margin-top:12px}
.stop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.x{width:40px;height:40px;padding:0;border-radius:50%;flex:none}
.steps{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
.steps span.now{color:var(--blue);font-weight:800}.steps span.ok{color:var(--good)}.steps span.ok::before{content:'✓ '}.steps i{font-style:normal;opacity:.5}
.stitle{font-size:20px;margin:6px 0 10px}
.card{background:var(--bg);border-radius:16px;padding:18px;margin:10px 0}
.ko{color:#475569;margin:6px 0;line-height:1.5}.en{font-weight:750;line-height:1.4;margin:6px 0}
.big.ko,.ko.big{font-size:22px;color:var(--ink);font-weight:700}.en.big{font-size:clamp(22px,6vw,30px)}
p.big{display:block;width:auto;padding:0}
.hint{color:var(--muted);font-size:15px;margin:6px 0 10px;line-height:1.5}
.answer{border-top:2px dashed #cbd5e1;margin-top:12px;padding-top:8px;cursor:pointer}
.actions{display:flex;gap:10px;margin-top:10px}.actions .big{flex:1}
.mic{min-height:24px;margin:8px 0;font-size:15px}.rec{color:#b91c1c}.good{color:var(--good);font-weight:800}.near{color:var(--warn);font-weight:800}.heard{color:var(--muted)}
.talk{display:grid;gap:10px;max-height:52vh;overflow:auto;padding:4px 2px}
.line{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.line.me{flex-direction:row-reverse}
.who{font-size:12px;color:var(--muted);flex:none;margin-top:10px;width:30px;text-align:center}
.bub{background:var(--you);border-radius:16px;padding:10px 14px;max-width:85%;transition:box-shadow .2s}
.me .bub{background:var(--me)}
.bub .en{margin:0;font-size:18px}.bub .ko{margin:2px 0 0;font-size:14px}
.line.playing .bub{box-shadow:0 0 0 3px var(--blue)}
.blank{display:inline-block;color:var(--blue);background:#fff;border-radius:8px;padding:2px 10px;font-size:15px}
.ex{display:grid;gap:8px;margin-top:12px}.exl{text-align:left;background:#fff;display:grid;gap:2px}.exl span{font-weight:400;color:var(--muted);font-size:14px}
.done{text-align:center;padding:28px 18px}.done h2{margin:6px 0}.fire{font-size:54px;font-weight:900;color:var(--blue)}
.ear .en{color:var(--blue)}
.rd{color:#7c3aed;font-size:14px;margin:2px 0;font-weight:500}.bub .rd{font-size:13px}
.chead .pick{padding:6px 12px;font-size:13px;margin-left:8px}.badge{margin-left:8px;font-size:12px;background:var(--navy);color:#fff;border-radius:999px;padding:3px 10px}
.course.focus{box-shadow:0 0 0 2px var(--blue),0 4px 18px #102f540d}.chead>.muted{margin-left:auto}
.linkcard{display:grid;gap:2px;background:var(--card);border-radius:20px;padding:16px 18px;margin:12px 0;text-decoration:none;color:var(--ink);box-shadow:0 4px 18px #102f540d}
.ear .en{white-space:pre-line}
</style>
</head>
<body>
<header><div class="in"><img src="./icon.svg" alt=""><h1>일본어 마스터</h1></div></header>
<main id="app"></main>
<script>window.APP_V='22'</script>
<script src="./course-ja.js"></script>
<script src="./talk.js"></script>
<script>
/* 새 버전 자동 반영: 열 때·다시 화면에 나올 때 version.json 확인 */
(function(){
  if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  function check(){fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
    if(!j||j.v===window.APP_V)return;const k='upd-'+j.v;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}
    (navigator.serviceWorker?navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}):Promise.resolve()).then(()=>location.replace(location.pathname+'?v='+j.v));
  }).catch(()=>{})}
  addEventListener('load',check);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
})();
</script>
</body>
</html>
