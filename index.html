<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172554"><link rel="manifest" href="./manifest.webmanifest"><title>일본어 마스터</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f4f7fb;color:#18243b}header{background:#172554;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 16px;background:#e2e8f0;font-weight:700;cursor:pointer}button.active,.primary{background:#2563eb;color:white}.panel{background:white;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 4px 20px #17255410}.layout{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}.kana{font-size:110px;text-align:center;margin:5px}.sub{text-align:center;color:#64748b}.board{position:relative;border:2px solid #cbd5e1;border-radius:16px;overflow:hidden;background:linear-gradient(90deg,transparent 49.8%,#e2e8f0 50%,transparent 50.2%),linear-gradient(transparent 49.8%,#e2e8f0 50%,transparent 50.2%);height:340px;touch-action:none}.guide{position:absolute;inset:0;display:grid;place-items:center;font-size:240px;color:#dbe3ef;pointer-events:none}.guide[hidden]{display:none}canvas{position:absolute;width:100%;height:100%;touch-action:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{font-size:24px;min-height:70px}.small{font-size:13px;color:#64748b}.progress{height:12px;background:#e2e8f0;border-radius:10px;overflow:hidden}.fill{height:100%;background:#22c55e}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}.tile{font-size:30px;padding:12px}.done{background:#dcfce7}section[hidden]{display:none}@media(max-width:720px){.layout{grid-template-columns:1fr}.kana{font-size:86px}.board{height:300px}}</style></head><body><header><h1>日本語 마스터</h1><div>히라가나부터 여행 회화까지 · S펜 학습</div></header><main><nav class="tabs"><button data-tab="learn" class="active">✍️ 쓰기·읽기</button><button data-tab="quiz">🧩 퀴즈</button><button data-tab="review">📚 복습·진도</button></nav><section id="learn" class="panel"><div class="layout"><div><div class="small" id="counter"></div><div class="kana" id="character"></div><div class="sub" id="reading"></div><div class="actions"><button class="primary" id="speak">🔊 발음 듣기</button><button id="known">✓ 익혔어요</button></div><div class="actions"><button id="prev">← 이전</button><button id="next">다음 →</button></div><p class="small">기본 46자. 실제 필기 평가가 아닌 자유 필기 연습입니다. 기기의 일본어 음성 엔진에 따라 발음이 달라질 수 있습니다.</p></div><div><strong>S펜 따라 쓰기</strong><div class="board" id="board"><div class="guide" id="guide"></div><canvas id="ink"></canvas></div><div class="actions"><button id="clear">지우기</button><button id="toggleGuide">가이드 숨기기</button></div><p class="small">S펜 또는 손가락으로 쓰세요. 필기 내용은 화면을 이동하면 지워집니다.</p></div></div></section><section id="quiz" class="panel" hidden><h2>읽기 퀴즈</h2><p id="question"></p><div class="choices" id="choices"></div><p id="feedback" aria-live="polite"></p><button class="primary" id="newQuiz">다음 문제</button><p class="small" id="quizScore"></p></section><section id="review" class="panel" hidden><h2>학습 진도</h2><p id="progressText"></p><div class="progress"><div class="fill" id="progressFill"></div></div><h3>히라가나 46자</h3><div class="grid" id="grid"></div><div class="actions"><button id="export">진도 백업</button><button id="import">진도 불러오기</button><input type="file" id="importFile" accept="application/json" hidden></div><p class="small">진도는 이 기기의 브라우저에 저장됩니다. 브라우저 데이터 삭제 시 사라질 수 있으므로 백업을 권장합니다.</p></section></main><script src="./app.js" defer></script></body></html>
